<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mag1kox</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Menú hamburguesa */
    .menu {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
    }

    .menu-icon {
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }

    .menu-content {
      display: none;
      margin-top: 10px;
      background: #222;
      border-radius: 10px;
      padding: 12px;
      width: 220px;
    }

    .menu-item {
      margin-bottom: 12px;
    }

    .menu-item:last-child {
      margin-bottom: 0;
    }

    .menu-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .submenu a {
      display: block;
      color: white;
      text-decoration: none;
      font-size: 14px;
      margin-left: 10px;
      margin-top: 4px;
    }

    .submenu a:hover {
      text-decoration: underline;
    }

    /* Portada */
    .portada {
      width: 100%;
      max-width: 600px;
      margin-top: 80px;
      border-radius: 14px;
    }

    /* Links */
    .links {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 260px;
    }

    .links a {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #222;
      padding: 14px;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .links a:hover {
      background: #333;
      transform: scale(1.03);
    }

    .links img {
      width: 32px;
      height: auto;
    }

    /* Logo del sello */
    .label-logo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 120px;
      opacity: 0.65;
    }

    .label-logo img {
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>

  <!-- Menú -->
  <div class="menu">
    <div class="menu-icon" onclick="toggleMenu()">☰</div>

    <div class="menu-content" id="menuContent">
      <div class="menu-item">
        <div class="menu-title">Discografía</div>
        <div class="submenu">
          <a href="#">AbsTrackTor</a>
        </div>
      </div>

      <div class="menu-item">
        <div class="menu-title">Contacto</div>
        <div class="submenu">
          <a href="mailto:mag1ko@mag1ko.com">mag1ko@mag1ko.com</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Portada -->
  <img src="portada.jpg" alt="Portada" class="portada">

  <!-- Links -->
  <div class="links">
    <a href="https://instagram.com/mag1kox" target="_blank">
      <img src="instagram.png" alt="Instagram">
    </a>

    <a href="#">
      <img src="spotify.png" alt="Spotify">
    </a>

    <a href="#">
      <img src="applemusic.png" alt="Apple Music">
    </a>

    <a href="#">
      <img src="amazonmusic.png" alt="Amazon Music">
    </a>

    <a href="#">
      <img src="deezer.png" alt="Deezer">
    </a>

    <a href="#">
      <img src="youtube.png" alt="YouTube">
    </a>
  </div>

  <!-- Logo sello -->
  <div class="label-logo">
    <img src="iarecords.png" alt="IA Records">
  </div>

  <!-- Script menú -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById("menuContent");
      menu.style.display = menu.style.display === "block" ? "none" : "block";
    }
  </script>

</body>
</html>
