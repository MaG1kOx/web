<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mag1kox</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Portada */
    .portada {
      width: 100%;
      max-width: 600px;
      margin-top: 30px;
      border-radius: 14px;
    }

    /* Contenedor de links */
    .links {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 260px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222;
      padding: 14px;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .links a:hover {
      background: #333;
      transform: scale(1.03);
    }

    .links img {
      width: 32px;
      height: auto;
    }

    /* Logo del sello */
    .label-logo {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 120px;
      opacity: 0.75;
    }

    .label-logo img {
      width: 100%;
      height: auto;
    }
    body {
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
  </style>
</head>

<body>

  <!-- Portada -->
  <img src="portada.jpg" alt="Portada" class="portada">

  <!-- Links -->
  <div class="links">
    <a href="https://instagram.com/mag1kox" target="_blank">
      <img src="instagram.png" alt="Instagram">
    </a>

    <a href="#">
      <img src="spotify.png" alt="Spotify">
    </a>

    <a href="#">
      <img src="applemusic.png" alt="Apple Music">
    </a>

    <a href="#">
      <img src="amazonmusic.png" alt="Amazon Music">
    </a>

    <a href="#">
      <img src="deezer.png" alt="Deezer">
    </a>

    <a href="#">
      <img src="youtube.png" alt="YouTube">
    </a>
  </div>

  <!-- Logo sello -->
  <div class="label-logo">
    <img src="iarecords.png" alt="IA Records">
  </div>

</body>
</html>
